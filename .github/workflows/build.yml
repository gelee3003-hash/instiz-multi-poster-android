
name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: unzip -o instiz-multi-poster-android.zip

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK
        working-directory: instiz-multi-poster-android
        run: gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: multi-poster-apk
          path: instiz-multi-poster-android/app/build/outputs/apk/debug/app-debug.apk
